version: 1
kind: agent-workflow-factory
factory_id: agent-experience-factory
factory_version: 0.1.0
core:
  workspace_root: ${AGENT_FACTORY_WORKSPACE_ROOT}
  binary: ${AGENT_CONTEXT_HARNESS_BIN}
configuration:
  dotfile_root: ${AGENT_FACTORY_DOTFILE_ROOT}
  source_root: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai
runtime_adapters:
  codex:
    source: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/codex
    generated: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/generated/codex/AGENTS.md
  claude:
    source: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/claude
    generated: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/generated/claude/AGENTS.md
  gemini:
    source: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/gemini
    generated: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/generated/gemini/GEMINI.md
  grok:
    source: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/grok
    generated: ${AGENT_FACTORY_DOTFILE_ROOT}/config/ai/generated/grok/AGENTS.md
  opencode:
    source: ${AGENT_FACTORY_DOTFILE_ROOT}/config/opencode
    generated: ${AGENT_FACTORY_RUNTIME_CONFIG_DIR}/AGENTS.md
plugins:
  waza:
    manifest: plugins/waza/manifest.yaml
    type: benchmark_runner
    status: mock_ready; real_when_installed
    version: 0.38.7
    install: https://github.com/microsoft/waza/blob/main/docs/GUIDE.md
    checksum: official_installer
    optional_for: mock_benchmark
excluded_paths:
  - ${AGENT_FACTORY_NON_ENTRY_ROOT}
data:
  default_root: ${AGENT_FACTORY_DATA_ROOT}
  portable_pack_kind: agent-experience-pack
